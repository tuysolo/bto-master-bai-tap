<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRADEnFUN · Mockup</title>
<style>
  /* 60/30/10: 60% nền trung tính, 30% bề mặt phụ (menu, thẻ, chữ xanh than), 10% xanh nhấn */
  :root {
    --bg: #f5f7fb; --panel: #ffffff; --side: #edf1f7; --line: #dde3ed; --line2: #ebeff5;
    --ink: #0f1b33; --muted: #5b6980; --faint: #94a0b5;
    --accent: #027dc0; --accent-soft: #e1f1fa; --on-accent: #ffffff; --accent-ink: #015e90;
    --gain: #0e9f6e; --gain-soft: #e3f6ee; --loss: #d93a45; --loss-soft: #fdeaeb; --loss-ink: #8f1f28;
    --warn: #b7791f; --warn-soft: #fdf3dc; --warn-ink: #6b4a08;
    --hover: #e3e9f2; --active: #e1f1fa; --th: #f5f7fb; --chip: #e8edf4;
    --radius: 12px; --rule: rgba(2, 125, 192, .07);
  }
  :root[data-theme="dark"] {
    --bg: #0f1522; --panel: #171e2e; --side: #121929; --line: #273046; --line2: #1e2638;
    --ink: #f2f4f8; --muted: #a0abc0; --faint: #6c7890;
    --accent: #00b6e8; --accent-soft: #0c2c40; --on-accent: #04121c; --accent-ink: #8fdcf7;
    --gain: #1fc98a; --gain-soft: #12322b; --loss: #f0524f; --loss-soft: #3a1c22; --loss-ink: #ffc4c2;
    --warn: #e5b454; --warn-soft: #33290f; --warn-ink: #f5dfa8;
    --hover: #1b2335; --active: #0c2c40; --th: #0f1522; --chip: #222b3e;
    --rule: rgba(0, 182, 232, .05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 14px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; }
  .num, td.n, th.n { font-variant-numeric: tabular-nums; }
  .gain { color: var(--gain); } .loss { color: var(--loss); } .muted { color: var(--muted); }

  /* ---------- khung chung ---------- */
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  .side { background: var(--side); border-right: 1px solid var(--line); padding: 18px 14px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: .01em; margin-bottom: 14px; font-size: 15px; }
  .brand i { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-style: normal; font-size: 13px; }
  .side select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin-bottom: 8px; }
  .grp { margin: 14px 8px 4px; color: var(--faint); font-size: 11px; letter-spacing: .08em; }
  .nav { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 7px; }
  .nav:hover { background: var(--hover); }
  .nav.on { background: var(--active); font-weight: 600; }
  .sync { margin-top: auto; padding: 12px 8px 0; font-size: 12.5px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gain); margin-right: 6px; }
  .dot.bad { background: var(--loss); } .dot.wait { background: var(--warn); } .dot.off { background: var(--faint); }
  .main { padding: 28px 28px 0; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
  .col { width: 100%; max-width: 1200px; margin: 0 auto; flex: 1; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; line-height: 1.25; }
  .sub { color: var(--muted); font-size: 13px; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tools select, .tools input[type=search] { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .seg button { border: 0; background: none; padding: 7px 12px; }
  .seg button.on { background: var(--ink); color: var(--bg); }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; }
  .btn:hover { border-color: #c9c9c3; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.danger { color: var(--loss); }
  .btn.sm { padding: 4px 9px; font-size: 12.5px; }
  .btn[disabled] { opacity: .55; cursor: default; }
  .link { border: 0; background: none; color: var(--accent); padding: 0; }
  .link:hover { text-decoration: underline; }
  footer { max-width: 1200px; width: 100%; margin: 32px auto 0; padding: 14px 0 22px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }

  .banner { border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .banner.demo { background: var(--accent-soft); color: var(--accent-ink); }
  .banner.err { background: var(--loss-soft); color: var(--loss-ink); }
  .banner.sync { background: var(--warn-soft); color: var(--warn-ink); }
  .bar { height: 6px; background: rgba(0,0,0,.08); border-radius: 3px; overflow: hidden; width: 180px; }
  .bar b { display: block; height: 100%; background: currentColor; transition: width .5s; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .card h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpis.k6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .kpi .v { font-size: 22px; font-weight: 650; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .kpi .l { color: var(--muted); font-size: 12.5px; margin-bottom: 4px; }
  .kpi .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .mb { margin-bottom: 14px; }
  svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
  svg.chart text { font-size: 10.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .hl { display: grid; gap: 8px; }
  .hl div { display: grid; grid-template-columns: 120px 1fr; gap: 8px; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 20px; }
  .tag.g { background: var(--gain-soft); color: var(--gain); } .tag.r { background: var(--loss-soft); color: var(--loss); }
  .tag.w { background: var(--warn-soft); color: var(--warn); } .tag.n { background: var(--chip); color: var(--muted); }
  .tag.b { background: var(--accent-soft); color: var(--accent); }

  .twrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 9px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line2); }
  th { font-weight: 600; color: var(--muted); font-size: 12px; background: var(--th); position: sticky; top: 0; }
  th.sort { cursor: pointer; } th.sort:hover { color: var(--ink); }
  td.n, th.n { text-align: right; }
  tr.row { cursor: pointer; } tr.row:hover td { background: var(--th); }
  tr:last-child td { border-bottom: 0; }

  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) minmax(0, 1.1fr); gap: 6px; }
  .cal .dh { color: var(--muted); font-size: 12px; padding: 0 4px 2px; }
  .cal .d { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); min-height: 74px; padding: 6px 8px; font-size: 12px; text-align: left; }
  .cal .d.out { background: transparent; border-color: transparent; }
  .cal .d.g { background: var(--gain-soft); border-color: var(--line); } .cal .d.r { background: var(--loss-soft); border-color: var(--line); }
  .cal .d.wk { background: var(--chip); border-style: dashed; }
  .cal .d b { display: block; font-size: 13px; font-variant-numeric: tabular-nums; }
  .cal button.d:hover { outline: 2px solid var(--accent); outline-offset: -1px; }

  .ins h4 { margin: 0 0 4px; font-size: 14px; }
  .ins .card { margin-bottom: 10px; }
  .ins .big { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .colh { font-size: 12px; letter-spacing: .08em; font-weight: 700; margin: 0 0 10px; }

  .skel { background: linear-gradient(90deg, var(--chip) 25%, var(--bg) 37%, var(--chip) 63%); background-size: 400% 100%; animation: sk 1.3s infinite; border-radius: 8px; }
  @keyframes sk { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  .empty { text-align: center; padding: 56px 20px; }
  .empty h2 { margin: 0 0 6px; font-size: 18px; }

  /* ---------- đăng nhập, nối sàn ---------- */
  .solo { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 48px 16px 0; }
  .solo .box { width: 100%; max-width: 400px; }
  .solo .wide { max-width: 860px; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 4px; }
  input[type=text], input[type=email], input[type=password] { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  input.bad { border-color: var(--loss); }
  .errmsg { color: var(--loss); font-size: 12.5px; margin-top: 4px; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 12px; margin: 16px 0 4px; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .gbtn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; }
  .gbtn img { width: 18px; height: 18px; }
  .steps { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; margin: 6px 0 18px; flex-wrap: wrap; }
  .steps b { color: var(--ink); } .steps span.sep { flex: 0 0 24px; height: 1px; background: var(--line); }
  .exs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .ex { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 16px 14px; text-align: left; }
  .ex:hover:not([disabled]) { border-color: var(--accent); }
  .ex strong { display: block; font-size: 15px; } .ex[disabled] { opacity: .55; cursor: default; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; }
  .guide ol { margin: 6px 0 12px; padding-left: 18px; } .guide li { margin-bottom: 4px; }
  .ip { font-weight: 600; background: var(--chip); padding: 2px 7px; border-radius: 6px; }
  .note { background: var(--warn-soft); color: var(--warn-ink); border-radius: 8px; padding: 9px 11px; font-size: 12.5px; }
  .alert { background: var(--loss-soft); color: var(--loss-ink); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-top: 12px; }

  /* ---------- lớp phủ ---------- */
  .ovl { position: fixed; inset: 0; background: rgba(20,22,28,.38); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
  .modal { background: var(--panel); border-radius: 12px; padding: 20px; width: 100%; max-width: 440px; }
  .modal h2 { margin: 0 0 8px; font-size: 17px; }
  .modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 460px; max-width: 100%; background: var(--panel); border-left: 1px solid var(--line); z-index: 41; padding: 20px; overflow-y: auto; box-shadow: -12px 0 30px rgba(0,0,0,.08); }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 10px; font-size: 13px; margin: 12px 0; }
  .kv span { color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; z-index: 60; font-size: 13px; }
  .menu-btn { display: none; }
  .prefs { display: flex; gap: 6px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .prefs select { width: auto; margin: 0; padding: 4px 6px; font-size: 12px; }
  .prefs .seg button { padding: 4px 9px; font-size: 12px; }
  .solo .prefs { position: absolute; top: 14px; right: 16px; margin: 0; }
  .ok-list { list-style: none; padding: 0; margin: 12px 0; } .ok-list li { padding: 4px 0 4px 26px; position: relative; }
  .ok-list li::before { content: "✓"; position: absolute; left: 0; top: 4px; width: 18px; height: 18px; border-radius: 50%; background: var(--gain-soft); color: var(--gain); font-size: 12px; font-weight: 700; display: grid; place-items: center; }

  /* ---------- mockup controls (not part of the product) ---------- */
  .ms { position: fixed; right: 14px; bottom: 14px; width: 268px; max-height: 76vh; background: #15171c; color: #d9dbe1; border-radius: 12px; z-index: 80; font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.3); display: flex; flex-direction: column; }
  .ms > button { background: none; border: 0; color: #fff; font-weight: 700; padding: 10px 12px; text-align: left; display: flex; justify-content: space-between; }
  .ms .in { padding: 0 12px 12px; overflow-y: auto; }
  .ms.closed .in { display: none; }
  .ms h5 { margin: 10px 0 5px; font-size: 11px; color: #8d919c; font-weight: 600; letter-spacing: .04em; }
  .ms .in button { background: #262932; border: 0; color: #d9dbe1; border-radius: 6px; padding: 3px 8px; margin: 0 4px 4px 0; font-size: 11.5px; }
  .ms .in button:hover { background: #343844; }
  .ms p { color: #8d919c; margin: 10px 0 0; }

  /* ---------- lớp thẩm mỹ v3: một phông không chân, nút và trạng thái gọn, bảng dày dữ liệu ---------- */
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
  .grp { margin: 16px 8px 4px; color: var(--muted); font-size: 12.5px; font-weight: 600; letter-spacing: 0; }
  .nav { margin-left: 14px; width: calc(100% - 14px); border-radius: 8px; padding: 7px 12px; position: relative; }
  .nav::before { content: ""; position: absolute; left: -7px; top: -1px; bottom: -1px; width: 1px; background: var(--line); }
  .nav.on { background: var(--active); color: var(--accent); font-weight: 600; }
  .btn { border: 1px solid transparent; background: var(--chip); border-radius: 8px; padding: 7px 13px; font-weight: 500; }
  .btn:hover { border-color: var(--line); }
  .btn.pri { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.pri:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--loss); }
  .seg { border-radius: 8px; padding: 2px; background: var(--chip); border-color: transparent; }
  .seg button { border-radius: 6px; padding: 5px 12px; color: var(--muted); }
  .seg button.on { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .tools select, .side select, .tools input[type=search] { border-radius: 8px; }
  .card { border-radius: 12px; }
  .card h3 { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .kpis { gap: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
  .kpis .card { border: 0; border-radius: 0; background: none; border-left: 1px solid var(--line); padding: 16px 18px; }
  .kpis .card:first-child { border-left: 0; }
  .kpi .l { font-size: 12.5px; margin-bottom: 6px; }
  .kpi .v { font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
  /* trạng thái: chấm màu + chữ thường, không dùng ô màu */
  .tag { background: none !important; padding: 0; border-radius: 0; font-size: 13px; font-weight: 500; color: var(--ink) !important; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .tag.g::before { background: var(--gain); } .tag.r::before { background: var(--loss); } .tag.w::before { background: var(--warn); } .tag.b::before { background: var(--accent); }
  /* bảng dày dữ liệu: không khung, chỉ có vạch ngang, số căn phải */
  .twrap { border: 0; border-radius: 0; background: none; border-top: 1px solid var(--line); }
  th { background: var(--bg); font-size: 12.5px; font-weight: 600; color: var(--ink); padding: 12px; border-bottom: 1px solid var(--line); }
  td { padding: 13px 12px; border-bottom: 1px solid var(--line2); }
  tr:last-child td { border-bottom: 1px solid var(--line2); }
  tr.row:hover td { background: var(--hover); }
  .card .twrap { border-top: 0; } .card .twrap td { padding: 9px 6px; } .card tr:last-child td { border-bottom: 0; }
  .mbar { height: 3px; background: var(--line); border-radius: 2px; margin: 5px 0 0 auto; position: relative; width: 76px; }
  .mbar i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
  .mbar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--faint); }
  .colh { font-size: 13px; letter-spacing: 0; }
  .banner { border-radius: 10px; }
  input[type=text], input[type=email], input[type=password] { border-radius: 10px; padding: 10px 12px; }
  .modal, .drawer { background: var(--panel); } .modal { border-radius: 14px; }
  .ex { border-radius: 12px; }

  h1 { display: flex; align-items: center; gap: 10px; font-size: 22px; }
  h1 svg { width: 22px; height: 22px; color: var(--accent); }
  .ico { width: 16px; height: 16px; flex: none; }
  .grp { display: flex; align-items: center; gap: 9px; margin: 18px 6px 6px; font-size: 13px; } .grp .ico { width: 17px; height: 17px; }
  .nav { margin-left: 15px; width: calc(100% - 15px); padding-left: 16px; }
  .kpi .v { font-size: 19px; } .ins .big { font-size: 16px; }
  .tools .prefs, .prefs { margin: 0; gap: 4px; }
  .iconbtn { display: inline-flex; align-items: center; gap: 5px; border: 1px solid transparent; background: var(--chip); border-radius: 8px; padding: 7px 9px; font-size: 12px; font-weight: 600; }
  .iconbtn:hover { border-color: var(--line); }
  .exbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .chipb { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px 5px 6px; font-weight: 500; }
  .chipb i { width: 20px; height: 20px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-style: normal; font-size: 10.5px; font-weight: 700; }
  .chipb.on { border-color: var(--accent); background: var(--active); color: var(--accent); } .chipb.on i { background: var(--accent); color: var(--on-accent); }
  .chipb.all { padding-left: 12px; }
  .exbar select { padding: 6px 10px; margin-left: auto; }
  svg.chart rect[data-tip]:not([data-cx]):hover { opacity: .75; }
  #tip { position: fixed; z-index: 90; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 5px 9px; border-radius: 7px; display: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ai-fab { position: fixed; right: 14px; bottom: 14px; z-index: 70; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 10px 16px 10px 12px; font-weight: 600; box-shadow: 0 8px 26px rgba(0,0,0,.22); }
  .ai-fab svg { color: var(--accent); width: 18px; height: 18px; } .ai-fab small { color: var(--muted); font-weight: 500; }
  .ai-pop { position: fixed; right: 14px; bottom: 66px; z-index: 71; width: 310px; max-width: calc(100vw - 28px); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: 0 14px 40px rgba(0,0,0,.28); }
  .ai-pop button.q { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: none; border-radius: 9px; padding: 8px 10px; margin-top: 6px; color: var(--muted); cursor: default; }
  .ms { bottom: 66px; }

  /* ---------- trang chủ: nền sổ kẻ dòng, thẻ kính mềm ---------- */
  .solo { background:
      radial-gradient(520px 340px at 16% 18%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 70%),
      radial-gradient(560px 380px at 88% 78%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%),
      repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px), var(--bg); overflow: hidden; }

<script>
/* TRADEnFUN mockup. Mọi dữ liệu ở đây là DỮ LIỆU MẪU do script sinh ra, không phải số thật, không nối sàn hay máy chủ nào. */

/* ---------- bộ sinh số có seed: mỗi lần mở ra cùng một bộ số ---------- */
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = rng(20261118);
const NOW = Date.UTC(2026, 10, 18, 7, 0);            // 14:00 GMT+7 ngày 18/11/2026
const DAY = 864e5, MIN = 6e4;
const EX = { binance: 'Binance Futures', okx: 'OKX', bingx: 'BingX', exness: 'Exness MT4 / MT5', bybit: 'Bybit' };
const SYMS = [['BTCUSDT', 91000], ['ETHUSDT', 3150], ['SOLUSDT', 182], ['BNBUSDT', 640], ['XRPUSDT', 1.12], ['DOGEUSDT', 0.19]];

let CONNS, TRADES, OPEN, TRANSFERS;
function seedData() {
  R = rng(20261118);   // sinh lại từ cùng một seed để số không đổi giữa các lần nhảy trạng thái

    { id: 'c1', ex: 'binance', name: 'Binance chính', key4: '9K2f', status: 'ok', far: NOW - 180 * DAY, last: NOW - 2 * MIN },
    { id: 'c2', ex: 'okx', name: 'OKX phụ', key4: 'x7Qd', status: 'ok', far: NOW - 180 * DAY, last: NOW - 2 * MIN },
    { id: 'c3', ex: 'bingx', name: 'BingX scalp', key4: 'm3Tz', status: 'ok', far: NOW - 92 * DAY, last: NOW - 3 * MIN },
    { id: 'c4', ex: 'binance', name: 'Binance phụ', key4: 'Lp8w', status: 'ok', far: NOW - 60 * DAY, last: NOW - 2 * MIN },
  ];
  TRADES = []; let t = NOW - 180 * DAY, prevLoss = false, prevClose = 0, id = 1;
  while (TRADES.length < 400 && t < NOW - 3 * 3600e3) {
    const revenge = prevLoss && R() < 0.3;
    t = revenge ? prevClose + (5 + R() * 22) * MIN : t + (-Math.log(1 - R()) * 11.4 + 0.4) * 3600e3;
    const hr = (new Date(t).getUTCHours() + 7) % 24;
    const side = R() < 0.56 ? 'Long' : 'Short';
    let p = 0.56 + (hr >= 8 && hr < 12 ? 0.15 : 0) - (hr >= 20 ? 0.11 : 0) - (revenge ? 0.2 : 0) + (side === 'Long' ? 0.03 : -0.03);

    const pct = (0.004 + R() * (win ? 0.021 : 0.018)) * (win ? 1 : -1);
    const entry = base * (0.94 + R() * 0.12), exit = entry * (1 + pct * (side === 'Long' ? 1 : -1));
    const gross = notional * pct, fee = notional * 0.001;
    const funding = hold > 300 ? notional * 0.0001 * (R() < 0.7 ? -1 : 1) * Math.ceil(hold / 480) : 0;
    const close = t + hold * MIN;
    if (close > NOW - 30 * MIN) break;
    TRADES.push({ id: id++, conn, sym, side, open: t, close, hold, qty: notional / entry, entry, exit, gross, fee, funding, net: gross - fee + funding, revenge });
    prevLoss = !win; prevClose = close; t = close;
  }

    { conn: 'c1', sym: 'BTCUSDT', side: 'Long', qty: 0.021, entry: 90410, mark: 91280, lev: 10, liq: 82150, open: NOW - 190 * MIN },
    { conn: 'c2', sym: 'ETHUSDT', side: 'Short', qty: 0.62, entry: 3184, mark: 3162, lev: 5, liq: 3790, open: NOW - 75 * MIN },
    { conn: 'c3', sym: 'SOLUSDT', side: 'Long', qty: 6.5, entry: 184.2, mark: 181.9, lev: 8, liq: 162.4, open: NOW - 40 * MIN },
  ];
  OPEN.forEach(o => o.upnl = (o.mark - o.entry) * o.qty * (o.side === 'Long' ? 1 : -1));

/* ---------- trạng thái của mockup ---------- */
const S = { exf: 'all', ai: false, theme: 'dark', route: 'dang-nhap', mode: 'data', acct: 'all', range: 30, net: true, tz: 7, demo: false, hasConn: true,
  login: { step: 'email', email: '', err: '' }, connect: { step: 1, ex: null, err: null, busy: false },
  sort: { k: 'close', dir: -1 }, q: '', ids: null, idsLabel: '', day: null, calMonth: [2026, 10],

let timers = [];
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

/* ---------- tiện ích ---------- */
const $ = s => document.querySelector(s);

const p2 = n => String(n).padStart(2, '0');

function dkey(ts) { const d = loc(ts); return `${d.getUTCFullYear()}-${p2(d.getUTCMonth() + 1)}-${p2(d.getUTCDate())}`; }

  return S.exf === 'all' ? `Đang gộp ${cs.length} tài khoản trên ${nx} sàn` : `${EX[S.exf]} · ${cs.length} tài khoản`; };
function setEx(e) { S.exf = e; S.acct = 'all'; render(); }
function exBar() { const exs = [...new Set(CONNS.map(c => c.ex))], accs = CONNS.filter(c => S.exf === 'all' || c.ex === S.exf);
  return `<div class="exbar"><button class="chipb all ${S.exf === 'all' ? 'on' : ''}" onclick="setEx('all')">Tất cả sàn</button>${exs.map(e => `<button class="chipb ${S.exf === e ? 'on' : ''}" onclick="setEx('${e}')"><i>${EX[e][0]}</i>${EX[e]}</button>`).join('')}
    <select aria-label="Tài khoản" onchange="S.acct=this.value;render()"><option value="all">Mọi tài khoản${S.exf === 'all' ? '' : ' ' + EX[S.exf]} (${accs.length})</option>${accs.map(c => `<option value="${c.id}" ${S.acct === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>`; }
const DATA_ROUTES = ['tong-quan', 'chi-tiet', 'lich', 'lenh', 'vi-the', 'thoi-quen'];
const RICON = { 'tong-quan': 'grid', 'chi-tiet': 'grid', 'lich': 'grid', 'lenh': 'bars', 'vi-the': 'bars', 'thoi-quen': 'bulb', 'tai-khoan-san': 'link', 'cai-dat': 'link' };
function scope(ignoreRange) {
  const from = S.range === 'all' || ignoreRange ? 0 : NOW - S.range * DAY;
  return TRADES.filter(t => inSc(t.conn) && t.close >= from);
}
function toast(msg) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }

/* ---------- chỉ số ---------- */
function stats(ts) {
  const w = ts.filter(t => pnl(t) > 0), l = ts.filter(t => pnl(t) <= 0);
  const gw = sum(w, pnl), gl = Math.abs(sum(l, pnl));
  let cum = 0, peak = 0, dd = 0; const curve = [];
  [...ts].sort((a, b) => a.close - b.close).forEach(t => { cum += pnl(t); peak = Math.max(peak, cum); dd = Math.max(dd, peak - cum); curve.push([t.close, cum]); });
  let streak = 0, sw = null; for (const t of [...ts].sort((a, b) => b.close - a.close)) { const x = pnl(t) > 0; if (sw === null) sw = x; if (x !== sw) break; streak++; }
  const best = ts.reduce((m, t) => !m || pnl(t) > pnl(m) ? t : m, null), worst = ts.reduce((m, t) => !m || pnl(t) < pnl(m) ? t : m, null);
  return { n: ts.length, w: w.length, l: l.length, total: sum(ts, pnl), pf: gl ? gw / gl : 0, wr: ts.length ? w.length / ts.length : 0,
    avgW: w.length ? gw / w.length : 0, avgL: l.length ? -gl / l.length : 0, dd, curve, streak, sw, best, worst,
    fee: sum(ts, t => t.fee), funding: sum(ts, t => t.funding), holdW: w.length ? sum(w, t => t.hold) / w.length : 0, holdL: l.length ? sum(l, t => t.hold) / l.length : 0 };
}
function equityNow() { const base = 10000 + sum(TRADES, t => t.net) + sum(TRANSFERS, x => x.amt) + sum(OPEN, o => o.upnl); return base * shareK(); }
function roi(ts) {
  if (S.range === 'all') return null;
  const from = NOW - S.range * DAY;
  const start = 10000 + sum(TRADES.filter(t => t.close < from), t => t.net) + sum(TRANSFERS.filter(x => x.t < from), x => x.amt);
  const flow = sum(TRANSFERS.filter(x => x.t >= from), x => x.amt);
  const k = shareK();
  const cap = (start + flow) * k; return cap > 0 ? sum(ts, t => t.net) / cap : null;
}

/* ---------- 8 nhận xét thói quen, tính bằng luật trên dữ liệu ---------- */
function insights(ts) {
  const out = [], N = t => ({ n: t.length, net: sum(t, pnl), wr: t.length ? t.filter(x => pnl(x) > 0).length / t.length : 0, ids: t.map(x => x.id) });
  const few = (title, n) => out.push({ grp: 'c', title, few: true, n });
  if (ts.length < 30) return { few: true, n: ts.length };
  const hb = h => Math.floor(((new Date(h).getUTCHours() + S.tz + 24) % 24) / 4);
  const byH = [0, 1, 2, 3, 4, 5].map(b => N(ts.filter(t => hb(t.open) === b))).map((x, b) => ({ ...x, lab: `${p2(b * 4)}–${p2(b * 4 + 4)}h` })).filter(x => x.n >= 10);
  if (byH.length >= 2) {
    const hi = byH.reduce((a, b) => b.net > a.net ? b : a), lo = byH.reduce((a, b) => b.net < a.net ? b : a);
    if (hi.net > 0) out.push({ grp: 's', title: 'Khung giờ vào lệnh tốt nhất', big: hi.lab, text: `Win rate ${f(hi.wr * 100, 0)}%, ${S.net ? 'Net' : 'Gross'} ${money(hi.net)}`, n: hi.n, ids: hi.ids });
    if (lo.net < 0) out.push({ grp: 'r', title: 'Khung giờ vào lệnh tệ nhất', big: lo.lab, text: `Win rate ${f(lo.wr * 100, 0)}%, ${S.net ? 'Net' : 'Gross'} ${money(lo.net)}`, n: lo.n, ids: lo.ids });
  } else few('Khung giờ vào lệnh', ts.length);
  const DN = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
  const byD = DN.map((lab, i) => ({ ...N(ts.filter(t => loc(t.open).getUTCDay() === i)), lab })).filter(x => x.n >= 10);
  if (byD.length >= 2) {
    const hi = byD.reduce((a, b) => b.net > a.net ? b : a), lo = byD.reduce((a, b) => b.net < a.net ? b : a);
    if (hi.net > 0) out.push({ grp: 's', title: 'Ngày trong tuần tốt nhất', big: hi.lab, text: `Win rate ${f(hi.wr * 100, 0)}%, ${money(hi.net)}`, n: hi.n, ids: hi.ids });
    if (lo.net < 0) out.push({ grp: 'c', title: 'Ngày trong tuần tệ nhất', big: lo.lab, text: `Win rate ${f(lo.wr * 100, 0)}%, ${money(lo.net)}`, n: lo.n, ids: lo.ids });
  }
  const srt = [...ts].sort((a, b) => a.open - b.open);
  const rev = srt.filter((t, i) => i > 0 && pnl(srt[i - 1]) <= 0 && t.open - srt[i - 1].close <= 30 * MIN && t.open >= srt[i - 1].close);
  if (rev.length >= 10) { const a = N(rev), rest = N(ts.filter(t => !rev.includes(t)));
    out.push({ grp: a.wr < rest.wr ? 'r' : 's', title: 'Vào lệnh gỡ trong 30 phút sau khi thua', big: money(a.net), text: `Win rate ${f(a.wr * 100, 0)}% so với ${f(rest.wr * 100, 0)}% ở các lệnh còn lại`, n: a.n, ids: a.ids });
  } else few('Vào lệnh gỡ sau khi thua', rev.length);
  const days = {}; ts.forEach(t => (days[dkey(t.open)] = days[dkey(t.open)] || []).push(t));
  const cnts = Object.values(days).map(d => d.length).sort((a, b) => a - b), med = cnts[Math.floor(cnts.length / 2)] || 1;
  const busy = Object.values(days).filter(d => d.length > 2 * med), calm = Object.values(days).filter(d => d.length <= 2 * med);
  if (busy.flat().length >= 10) { const a = sum(busy, d => sum(d, pnl)) / busy.length, b = sum(calm, d => sum(d, pnl)) / calm.length;
    out.push({ grp: a < b ? 'c' : 's', title: 'Những ngày giao dịch quá nhiều', big: `${money(a)} mỗi ngày`, text: `Ngày thường: ${money(b)} mỗi ngày. Quá nhiều = hơn ${2 * med} lệnh một ngày`, n: busy.flat().length, ids: busy.flat().map(t => t.id) });
  } else few('Giao dịch quá nhiều', busy.flat().length);

  const bySym = [...new Set(ts.map(t => t.sym))].map(s => ({ ...N(ts.filter(t => t.sym === s)), lab: s })).filter(x => x.n >= 10);

  const L = N(ts.filter(t => t.side === 'Long')), Sh = N(ts.filter(t => t.side === 'Short'));

    out.push({ grp: lo[3].net < 0 ? 'r' : 's', title: `${lo[0]} tốt hơn ${lo[2]}`, big: money(lo[1].net), text: `${lo[2]}: ${money(lo[3].net)}, win rate ${f(lo[3].wr * 100, 0)}%`, n: lo[3].n, ids: lo[3].ids }); }
  const after = srt.filter((t, i) => i >= 3 && [1, 2, 3].every(k => pnl(srt[i - k]) <= 0));
  if (after.length >= 10) { const a = N(after); out.push({ grp: a.net < 0 ? 'r' : 's', title: 'Lệnh ngay sau chuỗi 3 lệnh thua', big: money(a.net), text: `Win rate ${f(a.wr * 100, 0)}%`, n: a.n, ids: a.ids }); }
  else few('Lệnh ngay sau chuỗi 3 lệnh thua', after.length);

}

  document.querySelectorAll('.cross').forEach(g => g.style.display = 'none');
  if (el && el.dataset.cx) { const g = el.ownerSVGElement.querySelector('.cross'), cx = el.dataset.cx, cy = el.dataset.cy; g.style.display = '';
    g.querySelector('.cv').setAttribute('x1', cx); g.querySelector('.cv').setAttribute('x2', cx); g.querySelector('.chz').setAttribute('y1', cy); g.querySelector('.chz').setAttribute('y2', cy); g.querySelector('.cd').setAttribute('cx', cx); g.querySelector('.cd').setAttribute('cy', cy); }
  if (!el) { tip.style.display = 'none'; return; }
  tip.textContent = el.getAttribute('data-tip'); tip.style.display = 'block'; const w = tip.offsetWidth; tip.style.left = Math.min(window.innerWidth - w - 8, e.clientX + 12) + 'px'; tip.style.top = (e.clientY - 34) + 'px'; });
function lineChart(pts) {
  if (pts.length < 2) return '<div class="muted">Chưa đủ lệnh để vẽ.</div>';
  const W = 900, H = 220, L = 46, B = 20, T = 8;
  const ys = pts.map(p => p[1]).concat(0), mn = Math.min(...ys), mx = Math.max(...ys), sp = mx - mn || 1;
  const x = i => L + i * (W - L - 6) / (pts.length - 1), y = v => T + (mx - v) * (H - T - B) / sp;
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
  const end = pts[pts.length - 1][1], col = end >= 0 ? 'var(--gain)' : 'var(--loss)';
  const ticks = [mn, (mn + mx) / 2, mx].map(v => `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line2)"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v < 0 ? '−' : ''}${f(v, 0)}</text>`).join('');
  const nt = Math.min(7, pts.length), xl = Array.from({ length: nt }, (_, k) => { const i = Math.round(k * (pts.length - 1) / (nt - 1)); return `<text x="${x(i)}" y="${H - 4}" text-anchor="${k === 0 ? 'start' : k === nt - 1 ? 'end' : 'middle'}">${dt(pts[i][0]).slice(0, 5)}</text>`; }).join('');
  const hw = (W - L - 6) / (pts.length - 1) / 2, hit = pts.map((p, i) => `<rect x="${(x(i) - hw).toFixed(1)}" y="${T}" width="${(2 * hw).toFixed(1)}" height="${H - T - B}" fill="transparent" data-cx="${x(i).toFixed(1)}" data-cy="${y(p[1]).toFixed(1)}" data-tip="${dt(p[0])} · luỹ kế ${p[1] < 0 ? '−' : '+'}${f(p[1])} USDT"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Lãi luỹ kế">${ticks}<line x1="${L}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--faint)" stroke-dasharray="3 3"/>
    <path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    ${xl}${wm(W, H - B - 10)}<g class="cross" style="display:none" pointer-events="none"><line class="cv" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1" opacity=".7"/><line class="chz" x1="${L}" x2="${W}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1" opacity=".7"/><circle class="cd" r="4" fill="${col}" stroke="var(--panel)" stroke-width="2"/></g>${hit}</svg>`;
}
function barChart(items, opt = {}) {
  if (!items.length) return '<div class="muted">Chưa có dữ liệu.</div>';
  const W = opt.w || 440, H = opt.h || 170, B = 20, T = 14, mx = Math.max(...items.map(i => Math.abs(i.v)), 1e-9);
  const hasNeg = items.some(i => i.v < 0), zero = hasNeg ? T + (H - T - B) / 2 : H - B, span = (hasNeg ? (H - T - B) / 2 : H - T - B) - (opt.values ? 13 : 0);
  const bw = (W - 8) / items.length, show = opt.labels !== false;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="var(--line)"/>` + items.map((it, i) => {
    const h = Math.max(1, Math.abs(it.v) / mx * span), x0 = 4 + i * bw, yy = it.v >= 0 ? zero - h : zero;
    const col = opt.neutral ? 'var(--accent)' : it.v >= 0 ? 'var(--gain)' : 'var(--loss)';
    return `<rect x="${(x0 + bw * .14).toFixed(1)}" y="${yy.toFixed(1)}" width="${(bw * .72).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${col}" data-tip="${it.l}: ${it.v < 0 ? '−' : ''}${f(it.v, opt.d ?? 0)}${it.n != null ? ' · ' + it.n + ' lệnh' : ''}"></rect>`
      + (show && (!opt.every || (items.length - 1 - i) % opt.every === 0) ? `<text x="${x0 + bw / 2}" y="${H - 5}" text-anchor="middle">${it.l}</text>` : '')
      + (opt.values ? `<text x="${x0 + bw / 2}" y="${it.v >= 0 ? yy - 3 : yy + h + 10}" text-anchor="middle">${it.v < 0 ? '−' : it.v > 0 && !opt.neutral ? '+' : ''}${f(it.v, opt.d ?? 0)}</text>` : '');
  }).join('') + wm(W, T + 2) + '</svg>';
}

/* ---------- 3. Lịch ---------- */
function vLich() {
  const [yy, mm] = S.calMonth, title = `Tháng ${mm + 1}/${yy}`;
  const tools = `<button class="btn" onclick="calMove(-1)" aria-label="Tháng trước">◀</button><b>${title}</b><button class="btn" onclick="calMove(1)" aria-label="Tháng sau">▶</button>${netTool()}`;
  const g = guard(380); if (g) return shell('Lịch', acctLabel(), tools, g);
  const all = TRADES.filter(t => S.acct === 'all' || t.conn === S.acct), by = {};
  all.forEach(t => (by[dkey(t.close)] = by[dkey(t.close)] || []).push(t));
  const first = new Date(Date.UTC(yy, mm, 1)), lead = (first.getUTCDay() + 6) % 7, nd = new Date(Date.UTC(yy, mm + 1, 0)).getUTCDate();
  let cells = '', wk = 0, wn = 0, mTot = 0, mN = 0;
  const total = Math.ceil((lead + nd) / 7) * 7;
  for (let i = 0; i < total; i++) {
    const day = i - lead + 1;
    if (day < 1 || day > nd) cells += '<div class="d out"></div>';
    else { const k = `${yy}-${p2(mm + 1)}-${p2(day)}`, d = by[k] || [], v = sum(d, pnl); wk += v; wn += d.length; mTot += v; mN += d.length;
      cells += d.length ? `<button class="d ${v >= 0 ? 'g' : 'r'}" onclick="openDay('${k}')">${day}<b>${money(v, 0)}</b>${d.length} lệnh</button>` : `<div class="d">${day}</div>`; }
    if (i % 7 === 6) { cells += `<div class="d wk">Tuần<b>${wn ? money(wk, 0) : '—'}</b>${wn ? wn + ' lệnh' : ''}</div>`; wk = 0; wn = 0; }
  }
  return shell('Lịch', `${acctLabel()} · Tổng tháng: ${money(mTot)} · ${mN} lệnh`, tools,
    `<div class="card"><div class="cal">${['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN', 'Tuần'].map(d => `<div class="dh">${d}</div>`).join('')}${cells}</div>
     <p class="sub" style="margin:10px 0 0">Ô xanh là ngày lãi, ô đỏ là ngày lỗ. Bấm một ngày để mở các lệnh của ngày đó.</p></div>`);
}
function calMove(d) { let [y, m] = S.calMonth; m += d; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } S.calMonth = [y, m]; render(); }
function openDay(k) { S.day = k; S.ids = null; S.q = ''; go('lenh'); }

/* ---------- 4. Lệnh ---------- */
const COLS = [['status', 'Trạng thái'], ['conn', 'Sàn'], ['sym', 'Mã'], ['side', 'Chiều'], ['open', 'Mở lúc'], ['entry', 'Giá vào', 1], ['exit', 'Giá ra', 1], ['close', 'Đóng lúc'], ['qty', 'Khối lượng', 1], ['gross', 'Gross P&L', 1], ['fee', 'Phí', 1], ['funding', 'Funding', 1], ['net', 'Net P&L', 1], ['hold', 'Giữ', 1]];
function vLenh() {
  const tools = `<input type="search" placeholder="Tìm mã…" value="${esc(S.q)}" oninput="S.q=this.value;render(true)" id="q">${S.ids || S.day ? '' : rangeTool()}`;
  const g = guard(320); if (g) return shell('Lệnh', acctLabel(), tools, g);
  let ts = S.ids ? TRADES.filter(t => S.ids.includes(t.id)) : S.day ? TRADES.filter(t => dkey(t.close) === S.day && inSc(t.conn)) : scope();
  ts = ts.filter(t => inSc(t.conn));
  let rows = ts.map(t => ({ ...t, status: 'Closed' }));
  if (!S.ids && !S.day) rows = rows.concat(OPEN.filter(o => S.acct === 'all' || o.conn === S.acct).map((o, i) => ({ ...o, id: 'o' + i, status: 'Open', close: NOW + i, exit: null, gross: null, fee: null, funding: null, net: null, hold: (NOW - o.open) / MIN })));
  if (S.q) rows = rows.filter(t => t.sym.toLowerCase().includes(S.q.toLowerCase()));
  const { k, dir } = S.sort; rows.sort((a, b) => { const x = k === 'conn' ? cn(a.conn).name : a[k], y = k === 'conn' ? cn(b.conn).name : b[k]; return (x > y ? 1 : x < y ? -1 : 0) * dir; });
  const mxn = Math.max(1, ...rows.map(r => Math.abs(r.net || 0)));
  const chip = S.ids ? `<div class="banner demo"><span>Đang lọc: <b>${esc(S.idsLabel)}</b></span><button class="btn sm" onclick="S.ids=null;render()">Bỏ lọc</button></div>` : S.day ? `<div class="banner demo"><span>Đang lọc: lệnh đóng ngày <b>${S.day.split('-').reverse().join('/')}</b></span><button class="btn sm" onclick="S.day=null;render()">Bỏ lọc</button></div>` : '';
  const body = rows.length ? `<div class="twrap"><table><thead><tr>${COLS.map(([c, l, n]) => `<th class="sort ${n ? 'n' : ''}" onclick="sortBy('${c}')">${l} ${k === c ? (dir > 0 ? '↑' : '↓') : '<span style="color:var(--faint)">⇅</span>'}</th>`).join('')}</tr></thead><tbody>${rows.slice(0, 80).map(t => `<tr class="row" onclick="openTrade('${t.id}')">
      <td><span class="tag ${t.status === 'Open' ? 'b' : 'n'}">${t.status}</span></td><td>${esc(cn(t.conn).name)}</td><td><b>${t.sym}</b></td><td class="${t.side === 'Long' ? 'gain' : 'loss'}">${t.side}</td>
      <td>${dt(t.open)}</td><td class="n">${px(t.entry)}</td><td class="n">${t.exit ? px(t.exit) : '—'}</td><td>${t.status === 'Open' ? '—' : dt(t.close)}</td><td class="n">${f(t.qty, 3)}</td>
      <td class="n">${t.gross == null ? '—' : money(t.gross)}</td><td class="n">${t.fee == null ? '—' : f(t.fee)}</td><td class="n">${t.funding == null ? '—' : money(t.funding)}</td><td class="n"><b>${t.net == null ? '—' : money(t.net)}</b>${t.net == null ? '' : `<div class="mbar"><i style="${t.net >= 0 ? 'left' : 'right'}:50%;width:${(Math.abs(t.net) / mxn * 50).toFixed(1)}%;background:var(--${t.net >= 0 ? 'gain' : 'loss'})"></i></div>`}</td><td class="n">${dur(t.hold)}</td></tr>`).join('')}</tbody></table></div>
      <p class="sub" style="margin-top:8px">${rows.length > 80 ? `Đang hiện 80 trên ${rows.length} lệnh. ` : ''}Bấm tiêu đề cột để sắp xếp, bấm một dòng để xem các lần khớp.</p>`
    : `<div class="card empty"><h2>Không có lệnh nào khớp</h2><p class="muted">Thử đổi từ khoá, khoảng thời gian hoặc tài khoản.</p></div>`;
  const closed = rows.filter(r => r.status === 'Closed');
  return shell('Lệnh', `${acctLabel()} · ${rows.length} lệnh · Net ${money(sum(closed, t => t.net))}`, tools, chip + body);
}
function sortBy(k) { S.sort = { k, dir: S.sort.k === k ? -S.sort.dir : -1 }; render(); }
function openTrade(id) {
  const t = TRADES.find(x => String(x.id) === String(id)); if (!t) { toast('Lệnh đang mở: xem ở mục Vị thế mở'); return; }
  const r = rng(t.id * 77), k = 2 + Math.floor(r() * 2), fills = [];

    <div class="kv"><span>Mở lúc</span><b>${dt(t.open)}</b><span>Đóng lúc</span><b>${dt(t.close)}</b><span>Thời gian giữ</span><b>${dur(t.hold)}</b><span>Giá vào trung bình</span><b class="num">${px(t.entry)}</b><span>Giá ra trung bình</span><b class="num">${px(t.exit)}</b>
      <span>Gross P&L</span><b>${money(t.gross)}</b><span>Phí giao dịch</span><b class="num">−${f(t.fee)}</b><span>Funding</span><b>${money(t.funding) || '0,00'}</b><span>Net P&L</span><b>${money(t.net)}</b></div>

}

    document.title = 'SELFTEST W' + window.innerWidth + (wide.length ? ' CUON NGANG: ' + wide.join(', ') : ' khong cuon ngang') + ' ' + (errs.length ? 'FAIL ' + errs.join(' | ') : 'OK ' + TRADES.length + ' lenh');
    const tag = document.createElement('div'); tag.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99;background:#ff0;font:11px monospace;padding:2px'; tag.textContent = document.title; document.body.appendChild(tag);
  }
